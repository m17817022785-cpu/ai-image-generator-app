name: Patch Real Source Min

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch_real_source_min.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch source
        run: python3 scripts/patch_session_panel.py
      - name: Verify and commit
        run: |
          set -e
          grep -q "_confirmNewSession" lib/screens/home_screen.dart
          grep -q "展开创作面板" lib/screens/home_screen.dart
          grep -q "收起创作面板" lib/screens/home_screen.dart
          grep -q "version: 1.2.6+1002" pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "feat: add new session and collapsible studio panel"
            git push
          fi
