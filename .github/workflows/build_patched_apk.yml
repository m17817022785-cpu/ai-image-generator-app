name: Build Patched APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested patches
        shell: python
        run: |
          from pathlib import Path

          api = Path('lib/services/api_service.dart')
          s = api.read_text(encoding='utf-8')
          s = s.replace('涉及人物时，如画面主体明显不是儿童，请使用“成年女性/成年男性/adult woman/adult man”等明确成年表述，避免 young girl、young woman、少女、女孩等可能触发年龄歧义的词。', '涉及人物时，不要主动判断或补充年龄、性别、身份；参考图人物只称为“参考图中的人物 / 主体 / 角色形象”，强调保持面部特征、发型、服装、姿态、气质和整体视觉一致性。不要主动添加 young、adult、teen、girl、boy、child、少女、女孩、男孩、成年、年轻等年龄或身份词，除非用户原文明确要求。')
          old_return = """    final refined = parsed['choices']?[0]?['message']?['content']?.toString().trim() ?? '';
    return refined.isEmpty ? userText : refined;
  }

  Stream<String> generateChatStream"""
          new_return = """    final refined = parsed['choices']?[0]?['message']?['content']?.toString().trim() ?? '';
    return _neutralizeAutoAddedIdentityTerms(refined.isEmpty ? userText : refined, originalText: userText, hasReferenceImage: base64Image != null && base64Image.isNotEmpty);
  }

  bool _originalMentionsIdentityOrAge(String text) {
    final value = text.toLowerCase();
    const terms = ['young', 'adult', 'teen', 'teenager', 'girl', 'boy', 'child', 'woman', 'man', 'lady', '少女', '女孩', '男孩', '儿童', '小孩', '成年', '年轻', '女性', '男性', '女人', '男人'];
    return terms.any(value.contains);
  }

  String _neutralizeAutoAddedIdentityTerms(String prompt, {required String originalText, required bool hasReferenceImage}) {
    if (!hasReferenceImage || _originalMentionsIdentityOrAge(originalText)) return prompt.trim();
    var value = prompt;
    value = value
        .replaceAll(RegExp(r'\\byoung\\s+woman\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\byoung\\s+girl\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\badult\\s+woman\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\badult\\s+man\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\bteen(?:ager)?\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\bgirl\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\bboy\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\bwoman\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\bman\\b', caseSensitive: false), 'the person in the reference image')
        .replaceAll(RegExp(r'\\byouthful\\b', caseSensitive: false), 'natural')
        .replaceAll('年轻女性', '参考图中的人物')
        .replaceAll('年轻男子', '参考图中的人物')
        .replaceAll('成年女性', '参考图中的人物')
        .replaceAll('成年男性', '参考图中的人物')
        .replaceAll('少女', '参考图中的人物')
        .replaceAll('女孩', '参考图中的人物')
        .replaceAll('男孩', '参考图中的人物')
        .replaceAll('年轻', '自然')
        .replaceAll(RegExp(r'\\s+'), ' ')
        .trim();
    return value;
  }

  Stream<String> generateChatStream"""
          if '_neutralizeAutoAddedIdentityTerms' not in s and old_return in s:
              s = s.replace(old_return, new_return)
          api.write_text(s, encoding='utf-8')

          home = Path('lib/screens/home_screen.dart')
          s = home.read_text(encoding='utf-8')
          s = s.replace('图片接口触发了内容策略限制，未能生成图片。可以尝试把人物描述改成明确的“成年女性/成年男性”，或换一种更中性的画面描述后重试。', '图片接口触发了内容策略限制，未能生成图片。可以尝试避免年龄、身份类描述，只写“参考图中的人物/主体/角色形象”，或换一种更中性的画面描述后重试。')
          s = s.replace('或把人物描述改成明确的“成年女性/成年男性”后重试。', '或避免年龄、身份类描述，只写“参考图中的人物/主体/角色形象”后重试。')
          home.write_text(s, encoding='utf-8')

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          BUILD_NUMBER=${GITHUB_RUN_NUMBER:-1}
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
