name: Patch Collapse Header

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home screen collapsed header
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()

          # Ensure collapsed state field exists.
          if 'bool _studioHeaderCollapsed = true;' not in s:
              s = s.replace('  bool _enhanceImagePrompt = true;\n', '  bool _enhanceImagePrompt = true;\n  bool _studioHeaderCollapsed = true;\n')

          # Force default collapsed after settings load.
          old = "        _enhanceImagePrompt = (s['enhanceImagePrompt'] ?? 'true') == 'true';\n      });"
          new = "        _enhanceImagePrompt = (s['enhanceImagePrompt'] ?? 'true') == 'true';\n        // 默认收起对话上方的创作模式面板，用户仍可点箭头展开。\n        _studioHeaderCollapsed = true;\n      });"
          if new not in s:
              s = s.replace(old, new)

          # Persist collapsed flag if the settings service signature supports it in current source.
          old_save = "      enhanceImagePrompt: _enhanceImagePrompt,\n    );"
          new_save = "      enhanceImagePrompt: _enhanceImagePrompt,\n      studioHeaderCollapsed: _studioHeaderCollapsed,\n    );"
          if new_save not in s:
              s = s.replace(old_save, new_save)

          # Render compact header by default, expanded header only after user taps arrow.
          old_render = "SafeArea(top: false, child: Column(children: [_studioHeader(), Expanded(child: _messages.isEmpty ? _emptyState() : _messageList()), if (_loading) const LinearProgressIndicator(color: _primary, backgroundColor: Color(0x22756BFF), minHeight: 2), _composer()])),"
          new_render = "SafeArea(top: false, child: Column(children: [_studioHeaderCollapsed ? _compactStudioHeader() : _studioHeader(), Expanded(child: _messages.isEmpty ? _emptyState() : _messageList()), if (_loading) const LinearProgressIndicator(color: _primary, backgroundColor: Color(0x22756BFF), minHeight: 2), _composer()])),"
          if new_render not in s:
              s = s.replace(old_render, new_render)

          # Add collapse button to expanded header if missing.
          old_chip = "            _statusChip(),\n          ]),"
          new_chip = "            _statusChip(),\n            const SizedBox(width: 4),\n            IconButton(\n              tooltip: '收起面板',\n              onPressed: () async {\n                setState(() => _studioHeaderCollapsed = true);\n                await _saveAllSettings();\n              },\n              icon: const Icon(Icons.keyboard_arrow_up_rounded, color: _muted),\n              style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.58), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),\n            ),\n          ]),"
          if "tooltip: '收起面板'" not in s:
              s = s.replace(old_chip, new_chip)

          # Add compact header widget before status chip if missing.
          marker = "  Widget _statusChip() => InkWell("
          compact = r'''
  Widget _compactStudioHeader() => _glassPanel(
        margin: const EdgeInsets.fromLTRB(14, 4, 14, 8),
        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
        radius: 22,
        child: Row(children: [
          Container(
            width: 38,
            height: 38,
            decoration: BoxDecoration(borderRadius: BorderRadius.circular(14), gradient: const LinearGradient(colors: [_primary, _primary2])),
            child: const Icon(Icons.auto_awesome_rounded, color: Colors.white, size: 20),
          ),
          const SizedBox(width: 10),
          Expanded(
            child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: [
              Text(_forceImage ? '生图模式' : '智能模式', style: const TextStyle(color: _text, fontSize: 14, fontWeight: FontWeight.w900)),
              const SizedBox(height: 2),
              Text('画幅 $_imageAspectRatio · $_selectedSize · ${_qualityLabel(_imageQuality)}', overflow: TextOverflow.ellipsis, style: const TextStyle(color: _muted, fontSize: 11, fontWeight: FontWeight.w700)),
            ]),
          ),
          IconButton(
            tooltip: '图片参数',
            onPressed: _openImageParams,
            icon: const Icon(Icons.tune_rounded, color: _primary),
            style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.60), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),
          ),
          const SizedBox(width: 4),
          IconButton(
            tooltip: '展开面板',
            onPressed: () async {
              setState(() => _studioHeaderCollapsed = false);
              await _saveAllSettings();
            },
            icon: const Icon(Icons.keyboard_arrow_down_rounded, color: _muted),
            style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.60), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),
          ),
        ]),
      );

'''
          if '_compactStudioHeader() =>' not in s:
              s = s.replace(marker, compact + marker)

          p.write_text(s)

          # Bump version if needed.
          pub = Path('pubspec.yaml')
          ps = pub.read_text()
          ps = ps.replace('version: 1.2.2+85', 'version: 1.2.3+86')
          pub.write_text(ps)
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ui: keep studio header collapsed by default"
            git push
          fi
