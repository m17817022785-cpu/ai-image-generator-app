name: Patch Real Collapse
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_session_panel.py
      - run: git config user.name bot && git config user.email bot@example.com && git add lib/screens/home_screen.dart pubspec.yaml && git commit -m patch-real-collapse || true && git push || true
