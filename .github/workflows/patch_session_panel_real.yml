name: Patch Session Panel Real

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  patch:
    name: Patch real app source and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch home screen and pubspec
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('lib/screens/home_screen.dart')
          text = home.read_text(encoding='utf-8')

          if "bool _studioHeaderCollapsed" not in text:
              text = text.replace(
                  "bool _enhanceImagePrompt = true;\n  int _imageCount = 1;",
                  "bool _enhanceImagePrompt = true;\n  bool _studioHeaderCollapsed = false;\n  int _imageCount = 1;",
                  1,
              )

          if "Future<void> _confirmNewSession()" not in text:
              marker = "  void _snack(String message) {\n"
              insert = """  Future<void> _confirmNewSession() async {
    if (_messages.isEmpty && _input.text.trim().isEmpty && _attachedFiles.isEmpty) {
      _startNewSession();
      return;
    }
    final confirmed = await showDialog<bool>(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: Colors.white.withOpacity(.96),
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
        title: const Text('开新会话', style: TextStyle(fontWeight: FontWeight.w900)),
        content: const Text('将清空当前聊天记录、输入内容和参考图。确定开始新会话吗？'),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('取消')),
          FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('开始')),
        ],
      ),
    );
    if (confirmed == true) _startNewSession();
  }

  void _startNewSession() {
    setState(() {
      _messages.clear();
      _input.clear();
      _attachedFiles.clear();
      _attachedBase64Images.clear();
      _loading = false;
      _forceImage = false;
      _studioHeaderCollapsed = false;
    });
    _snack('已开启新会话');
  }

  void _setStudioHeaderCollapsed(bool value) {
    if (_studioHeaderCollapsed == value) return;
    setState(() => _studioHeaderCollapsed = value);
  }

"""
              if marker not in text:
                  raise SystemExit('Cannot find _snack marker')
              text = text.replace(marker, insert + marker, 1)

          # Add AppBar new session action before debug/settings actions if not present.
          if "_roundIcon(Icons.add_comment_rounded" not in text:
              old = """        actions: [
          _roundIcon(Icons.terminal_rounded, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DebugConsoleScreen()))),
          _roundIcon(Icons.settings_rounded, _openSettings),
          const SizedBox(width: 8),
        ],"""
              new = """        actions: [
          _roundIcon(Icons.add_comment_rounded, _confirmNewSession),
          _roundIcon(Icons.terminal_rounded, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DebugConsoleScreen()))),
          _roundIcon(Icons.settings_rounded, _openSettings),
          const SizedBox(width: 8),
        ],"""
              if old not in text:
                  raise SystemExit('Cannot find AppBar actions block')
              text = text.replace(old, new, 1)

          # Replace studio header with collapsible version.
          start = text.find("  Widget _studioHeader() => _glassPanel(")
          end = text.find("\n  Widget _statusChip() =>", start)
          if start == -1 or end == -1:
              raise SystemExit('Cannot find _studioHeader block')
          current_block = text[start:end]
          if "展开创作面板" not in current_block:
              replacement = r'''  Widget _studioHeader() {
    if (_studioHeaderCollapsed) {
      return _glassPanel(
        margin: const EdgeInsets.fromLTRB(14, 4, 14, 8),
        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
        radius: 24,
        child: InkWell(
          onTap: () => _setStudioHeaderCollapsed(false),
          borderRadius: BorderRadius.circular(20),
          child: Row(children: [
            Container(
              width: 40,
              height: 40,
              decoration: BoxDecoration(
                borderRadius: BorderRadius.circular(15),
                gradient: const LinearGradient(colors: [_primary, _primary2]),
                boxShadow: [BoxShadow(color: _primary.withOpacity(.20), blurRadius: 18, offset: const Offset(0, 8))],
              ),
              child: const Icon(Icons.auto_awesome_rounded, color: Colors.white, size: 22),
            ),
            const SizedBox(width: 10),
            Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
              Text(_forceImage ? '图像创作模式' : '智能创作模式', style: const TextStyle(color: _text, fontSize: 15, fontWeight: FontWeight.w900)),
              const SizedBox(height: 2),
              Text('画幅 $_imageAspectRatio · $_selectedSize · ${_qualityLabel(_imageQuality)}画质 · $_imageCount 张', style: const TextStyle(color: _muted, fontSize: 11, fontWeight: FontWeight.w700), overflow: TextOverflow.ellipsis),
            ])),
            const SizedBox(width: 8),
            const Text('展开创作面板', style: TextStyle(color: _muted, fontSize: 12, fontWeight: FontWeight.w800)),
            const SizedBox(width: 4),
            const Icon(Icons.keyboard_arrow_down_rounded, color: _muted),
          ]),
        ),
      );
    }

    return _glassPanel(
        margin: const EdgeInsets.fromLTRB(14, 4, 14, 8),
        padding: const EdgeInsets.all(14),
        radius: 28,
        child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
          Row(children: [
            Container(width: 56, height: 56, decoration: BoxDecoration(borderRadius: BorderRadius.circular(20), gradient: const LinearGradient(begin: Alignment.topLeft, end: Alignment.bottomRight, colors: [_primary, _primary2]), boxShadow: [BoxShadow(color: _primary.withOpacity(.28), blurRadius: 22, offset: const Offset(0, 10))]), child: const Icon(Icons.auto_awesome_rounded, color: Colors.white, size: 28)),
            const SizedBox(width: 12),
            Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(_forceImage ? '图像创作模式' : '智能创作模式', style: const TextStyle(color: _text, fontSize: 17, fontWeight: FontWeight.w900)), const SizedBox(height: 4), Text('画幅 $_imageAspectRatio · $_selectedSize · ${_qualityLabel(_imageQuality)}画质 · $_imageCount 张', style: const TextStyle(color: _muted, fontSize: 12, fontWeight: FontWeight.w700))])),
            _statusChip(),
          ]),
          const SizedBox(height: 12),
          Row(children: [Expanded(child: _modeButton(Icons.auto_awesome, '自动', !_forceImage, () => setState(() => _forceImage = false))), const SizedBox(width: 8), Expanded(child: _modeButton(Icons.brush_rounded, '生图', _forceImage, () => setState(() => _forceImage = true))), const SizedBox(width: 8), Expanded(child: _modeButton(Icons.add_photo_alternate_rounded, '参考图', _attachedFiles.isNotEmpty, _pickImage))]),
          const SizedBox(height: 10),
          InkWell(onTap: _openImageParams, borderRadius: BorderRadius.circular(20), child: Container(padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12), decoration: BoxDecoration(color: Colors.white.withOpacity(.58), borderRadius: BorderRadius.circular(20), border: Border.all(color: _line)), child: Row(children: [const Icon(Icons.tune_rounded, color: _primary), const SizedBox(width: 8), Expanded(child: Text('图片参数 · $_imageAspectRatio · ${_qualityLabel(_imageQuality)} · $_imageCount 张 · ${_enhanceImagePrompt ? '润色开' : '润色关'}', style: const TextStyle(color: _text, fontWeight: FontWeight.w900))), const Icon(Icons.keyboard_arrow_up_rounded, color: _muted)]))),
          const SizedBox(height: 10),
          Align(
            alignment: Alignment.centerRight,
            child: TextButton.icon(
              onPressed: () => _setStudioHeaderCollapsed(true),
              icon: const Icon(Icons.keyboard_arrow_up_rounded),
              label: const Text('收起创作面板'),
            ),
          ),
        ]),
      );
  }'''
              text = text[:start] + replacement + text[end:]

          # Make composer collapse the panel when user starts a new message.
          old_send = """  Future<void> _send() async {
    final text = _input.text.trim();"""
          new_send = """  Future<void> _send() async {
    _setStudioHeaderCollapsed(true);
    final text = _input.text.trim();"""
          if old_send in text and new_send not in text:
              text = text.replace(old_send, new_send, 1)

          required = ['_confirmNewSession', '_startNewSession', '_setStudioHeaderCollapsed', '展开创作面板', '收起创作面板', 'add_comment_rounded']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Patch missing markers: ' + ', '.join(missing))
          home.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          p2 = re.sub(r'^version:\s*1\.2\.5\+1001\s*$', 'version: 1.2.6+1002', p, count=1, flags=re.M)
          if p2 == p:
              raise SystemExit('Version line was not updated')
          pubspec.write_text(p2, encoding='utf-8')

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "_confirmNewSession" lib/screens/home_screen.dart
          grep -q "_startNewSession" lib/screens/home_screen.dart
          grep -q "_setStudioHeaderCollapsed" lib/screens/home_screen.dart
          grep -q "展开创作面板" lib/screens/home_screen.dart
          grep -q "收起创作面板" lib/screens/home_screen.dart
          grep -q "version: 1.2.6+1002" pubspec.yaml

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add new session and collapsible studio panel"
          git push
