name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Android debug keystore for stable fallback signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure Android debug keystore exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keystore ~/.android/debug.keystore \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Created new fallback debug keystore. It will be cached for future builds."
          else
            echo "Using cached fallback debug keystore."
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:' || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          PUBSPEC_BUILD_NUMBER=${APP_VERSION#*+}
          RUN_NUMBER=${GITHUB_RUN_NUMBER:-0}

          if ! [[ "$PUBSPEC_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            PUBSPEC_BUILD_NUMBER=1
          fi
          if ! [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]]; then
            RUN_NUMBER=0
          fi

          if [ "$RUN_NUMBER" -gt "$PUBSPEC_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$RUN_NUMBER"
          else
            BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER"
          fi

          echo "Building APK versionName=$BUILD_NAME versionCode=$BUILD_NUMBER pubspecBuildNumber=$PUBSPEC_BUILD_NUMBER githubRunNumber=$RUN_NUMBER"
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/AI-Image-Generator-release.apk
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Image-Generator-release-apk
          path: artifacts/AI-Image-Generator-release.apk
          if-no-files-found: error
          retention-days: 30
