name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
          cache: true

      - name: Patch studio header collapsed by default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          if 'bool _studioHeaderCollapsed = true;' not in s:
              s = s.replace('  bool _enhanceImagePrompt = true;\n', '  bool _enhanceImagePrompt = true;\n  bool _studioHeaderCollapsed = true;\n')
          if '_studioHeaderCollapsed ? _compactStudioHeader() : _studioHeader()' not in s:
              s = s.replace('SafeArea(top: false, child: Column(children: [_studioHeader(),', 'SafeArea(top: false, child: Column(children: [_studioHeaderCollapsed ? _compactStudioHeader() : _studioHeader(),')
          old_load = "        _enhanceImagePrompt = (s['enhanceImagePrompt'] ?? 'true') == 'true';\n      });"
          new_load = "        _enhanceImagePrompt = (s['enhanceImagePrompt'] ?? 'true') == 'true';\n        _studioHeaderCollapsed = true;\n      });"
          if old_load in s and new_load not in s:
              s = s.replace(old_load, new_load)
          old_chip = '            _statusChip(),\n          ]),'
          new_chip = '''            _statusChip(),
            const SizedBox(width: 4),
            IconButton(
              tooltip: '收起面板',
              onPressed: () => setState(() => _studioHeaderCollapsed = true),
              icon: const Icon(Icons.keyboard_arrow_up_rounded, color: _muted),
              style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.58), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),
            ),
          ]),'''
          if "tooltip: '收起面板'" not in s and old_chip in s:
              s = s.replace(old_chip, new_chip)
          marker = '  Widget _statusChip() => InkWell('
          compact = r'''
  Widget _compactStudioHeader() => _glassPanel(
        margin: const EdgeInsets.fromLTRB(14, 4, 14, 8),
        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
        radius: 22,
        child: Row(children: [
          Container(width: 38, height: 38, decoration: BoxDecoration(borderRadius: BorderRadius.circular(14), gradient: const LinearGradient(colors: [_primary, _primary2])), child: const Icon(Icons.auto_awesome_rounded, color: Colors.white, size: 20)),
          const SizedBox(width: 10),
          Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: [
            Text(_forceImage ? '生图模式' : '智能模式', style: const TextStyle(color: _text, fontSize: 14, fontWeight: FontWeight.w900)),
            const SizedBox(height: 2),
            Text('画幅 $_imageAspectRatio · $_selectedSize · ${_qualityLabel(_imageQuality)}', overflow: TextOverflow.ellipsis, style: const TextStyle(color: _muted, fontSize: 11, fontWeight: FontWeight.w700)),
          ])),
          IconButton(tooltip: '图片参数', onPressed: _openImageParams, icon: const Icon(Icons.tune_rounded, color: _primary), style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.60), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)))),
          const SizedBox(width: 4),
          IconButton(tooltip: '展开面板', onPressed: () => setState(() => _studioHeaderCollapsed = false), icon: const Icon(Icons.keyboard_arrow_down_rounded, color: _muted), style: IconButton.styleFrom(backgroundColor: Colors.white.withOpacity(.60), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)))),
        ]),
      );

'''
          if '_compactStudioHeader() =>' not in s and marker in s:
              s = s.replace(marker, compact + marker)
          p.write_text(s, encoding='utf-8')
          pub = Path('pubspec.yaml')
          ps = pub.read_text(encoding='utf-8').replace('version: 1.2.2+85', 'version: 1.2.3+86')
          pub.write_text(ps, encoding='utf-8')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          PUBSPEC_BUILD_NUMBER=${APP_VERSION#*+}
          BUILD_NUMBER=${GITHUB_RUN_NUMBER:-$PUBSPEC_BUILD_NUMBER}
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER"
          fi
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
