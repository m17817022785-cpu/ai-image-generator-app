name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply HomeScreen hotfix
        run: python3 .github/scripts/apply_hotfix.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore 1.2.10 compatible cached debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Require 1.2.10 compatible cached debug keystore
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA256="120e5cf415cf7cbd17a66b29503a1ff57f5025f14a4caebab4790db94c197b19"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: 1.2.10 compatible cached debug keystore is missing." >&2
            echo "Expected GitHub Actions cache key: android-debug-keystore-v1" >&2
            echo "Refusing to generate a new key because that would cause Android signing conflict." >&2
            exit 1
          fi
          echo "Using cached debug keystore compatible with 1.2.10: $KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep -E 'Alias name:|SHA1:|SHA256:' || true
          ACTUAL_SHA256=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Cached keystore SHA-256 mismatch." >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $ACTUAL_SHA256" >&2
            echo "Refusing to build APK that cannot upgrade the installed 1.2.10 app." >&2
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' "$KEYSTORE" > android/key.properties
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${APP_VERSION%%+*}
          PUBSPEC_BUILD_NUMBER=${APP_VERSION##*+}
          BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pubspec build number: $BUILD_NUMBER" >&2
            exit 1
          fi
          echo "Building APK versionName=$BUILD_NAME versionCode=$BUILD_NUMBER signingSha256=120e5cf415cf7cbd17a66b29503a1ff57f5025f14a4caebab4790db94c197b19"
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA256="120e5cf415cf7cbd17a66b29503a1ff57f5025f14a4caebab4790db94c197b19"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found: $APK_PATH" >&2
            exit 1
          fi
          APKSIGNER=${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee /tmp/apk-certs.txt
          ACTUAL_SHA256=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' /tmp/apk-certs.txt)
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "ERROR: Failed to parse APK certificate SHA-256 digest." >&2
            cat /tmp/apk-certs.txt >&2
            exit 1
          fi
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate mismatch." >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $ACTUAL_SHA256" >&2
            exit 1
          fi
          echo "APK signing certificate matches 1.2.10 installed-app certificate."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-1-2-10-compatible-signing
          path: build/app/outputs/flutter-apk/app-release.apk
