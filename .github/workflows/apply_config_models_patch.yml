name: Apply Config Models Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python3 tools/apply_config_models_patch.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/settings_service.dart lib/services/api_service.dart lib/screens/home_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add provider model fetch in settings"
            git push
          fi
