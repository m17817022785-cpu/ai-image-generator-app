plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// CI provides the 1.2.10-compatible cached debug keystore through environment variables
// and/or android/key.properties. Release builds must still be explicitly signed.
def envStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def envStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def envKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

def releaseStoreFile = keystoreProperties['storeFile'] ?: envStoreFile
def releaseStorePassword = keystoreProperties['storePassword'] ?: envStorePassword
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: envKeyAlias
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: envKeyPassword

def hasReleaseSigning = releaseStoreFile != null &&
        releaseStorePassword != null &&
        releaseKeyAlias != null &&
        releaseKeyPassword != null

android {
    namespace "com.example.ai_image_generator"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.ai_image_generator"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (!hasReleaseSigning) {
                throw new GradleException("Release signing is required. Configure android/key.properties locally or CI signing environment variables. This project currently uses the 1.2.10-compatible cached debug keystore in GitHub Actions to avoid Android signature conflicts with installed 1.2.10 builds.")
            }
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
