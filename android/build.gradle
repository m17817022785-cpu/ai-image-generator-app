buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Compatibility shim for older Flutter plugins that still read
// rootProject.ext.flutter.compileSdkVersion/minSdkVersion/targetSdkVersion.
// The Flutter Gradle plugin exposes these values to the app module, but some
// third-party plugin Gradle scripts (for example gal 2.x) evaluate before that
// extension is available on their own project.
ext.flutter = [
    compileSdkVersion: 34,
    minSdkVersion    : 21,
    targetSdkVersion : 34,
    ndkVersion       : '25.1.8937393'
]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Provide fallback properties for plugins that expect them
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                if (compileSdkVersion == null) {
                    compileSdkVersion 34
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
