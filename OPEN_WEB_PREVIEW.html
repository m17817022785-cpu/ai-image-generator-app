<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打开 Luna AI 网页预览</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: radial-gradient(circle at top left, rgba(124,58,237,.32), transparent 28rem), linear-gradient(135deg, #111827, #050816);
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      width: min(100%, 520px);
      padding: 28px;
      border-radius: 28px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      font-size: 34px;
      box-shadow: 0 18px 42px rgba(124,58,237,.32);
    }
    h1 { margin: 0; font-size: 24px; }
    p { color: #cbd5e1; line-height: 1.6; }
    a.button {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 18px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
    }
    code {
      display: block;
      margin-top: 18px;
      padding: 12px;
      border-radius: 14px;
      color: #e2e8f0;
      background: rgba(0,0,0,.28);
      overflow-wrap: anywhere;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="icon">✦</div>
      <h1>Luna AI 网页预览</h1>
      <p>点击下面按钮打开网页版 UI 预览。如果按钮无效，请手动打开 <strong>web_preview/index.html</strong>。</p>
      <a class="button" href="web_preview/index.html">打开网页版预览</a>
      <code>web_preview/index.html</code>
    </section>
  </div>
</body>
</html>
